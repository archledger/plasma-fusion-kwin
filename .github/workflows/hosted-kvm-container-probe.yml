name: Hosted restricted KVM access

on:
  push:
    branches: ['ci/hosted-runtime-probe']
    paths:
      - '.github/workflows/hosted-kvm-container-probe.yml'
      - 'tools/probe_container_kvm.py'
      - 'tools/kvm_api_probe.py'
      - 'tests/test_container_kvm.py'

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'archledger/plasma-fusion-kwin'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the container boundary checks
        run: python3 -m unittest discover -s tests -p test_container_kvm.py -v

      - name: Probe KVM from the restricted helper
        run: >-
          python3 tools/probe_container_kvm.py
          --output "${{ runner.temp }}/hosted-container-kvm.json"

      - name: Retain capability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-container-kvm
          path: ${{ runner.temp }}/hosted-container-kvm.json
          if-no-files-found: error
          retention-days: 14
