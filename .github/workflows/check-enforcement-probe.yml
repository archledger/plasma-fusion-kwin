name: Disposable required-check enforcement probe
on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Exact approved disposable experiment ID
        required: true
        type: string
      stage:
        description: One explicitly approved stage
        required: true
        type: choice
        options: [A1, A2, A3, B1, B2, B3]
      authority_sha:
        description: Exact unchanged production authority snapshot
        required: true
        type: string
      predecessor_run:
        description: Verified prior stage run, empty only for A1
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  probe:
    if: github.repository == 'archledger/plasma-fusion-kwin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: native-gate-reporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute one fenced, disposable App-only stage
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_GATE_PRIVATE_KEY: ${{ secrets.NATIVE_GATE_PRIVATE_KEY }}
          ENFORCEMENT_EXPERIMENT_ID: ${{ inputs.experiment_id }}
          ENFORCEMENT_STAGE: ${{ inputs.stage }}
          ENFORCEMENT_AUTHORITY_SHA: ${{ inputs.authority_sha }}
          ENFORCEMENT_PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
        run: python3 -B -m tools.probe_check_enforcement
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: check-enforcement-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/check-enforcement-probe/report.json
            ${{ runner.temp }}/check-enforcement-probe/admit-journal.json
            ${{ runner.temp }}/check-enforcement-probe/report-journal.json
          if-no-files-found: error
          retention-days: 14
