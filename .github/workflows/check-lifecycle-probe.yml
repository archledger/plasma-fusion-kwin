name: Disposable App check lifecycle probe
on:
  workflow_dispatch:
    inputs:
      coordination_sha:
        description: Exact held authority tip; this probe never changes it
        required: true
        type: string
      stage:
        description: One actual run in the separately approved A/B/C sequence
        required: true
        type: choice
        options: [A, B, C]
      predecessor_run:
        description: Exact successful preceding probe run (empty for A)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.repository == 'archledger/plasma-fusion-kwin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: native-gate-reporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Probe one disposable pair, without native execution
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_COORDINATION_SHA: ${{ inputs.coordination_sha }}
          CHECK_PROBE_STAGE: ${{ inputs.stage }}
          CHECK_PREDECESSOR_RUN: ${{ inputs.predecessor_run }}
          NATIVE_GATE_PRIVATE_KEY: ${{ secrets.NATIVE_GATE_PRIVATE_KEY }}
        run: python3 -B -m tools.probe_check_lifecycle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: check-lifecycle-${{ github.run_id }}-1
          path: ${{ runner.temp }}/check-lifecycle-probe/report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: check-lifecycle-journals-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/check-lifecycle-probe/admit-journal.json
            ${{ runner.temp }}/check-lifecycle-probe/report-journal.json
          if-no-files-found: error
          retention-days: 14
